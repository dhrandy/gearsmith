<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png" />
    <!-- iPhones ignore SVG touch icons, so the home-screen icon needs a PNG -->
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gearsmith" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Gearsmith</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div id="top" hidden>
    <header class="top">
      <div class="wrap topbar">
        <a class="logo" href="#/"><img src="/static/icon.svg" alt="" width="34" height="34" /><span id="app-name">Gearsmith</span></a>
        <span class="spacer"></span>
        <span class="user-badge" id="user-badge"></span>
        <button class="small" id="logout" type="button">Sign out</button>
      </div>
      <nav class="wrap tabs" id="tabs" aria-label="Sections">
        <a class="tab" href="#/" data-tab="gear">Gear</a>
        <a class="tab" href="#/songs" data-tab="songs" id="tab-songs">Songs</a>
        <a class="tab" href="#/sets" data-tab="sets" id="tab-sets">Sets</a>
        <a class="tab" href="#/due" data-tab="due" id="tab-due">Restrings</a>
        <a class="tab" href="#/tuner" data-tab="tuner" id="tab-tuner">Tuner</a>
        <a class="tab" href="#/settings" data-tab="settings">Settings</a>
      </nav>
    </header>
    <div class="wrap searchbar">
      <div class="gsearch">
        <input type="search" id="global-search" placeholder="Search gear, songs, presets, sets..." autocomplete="off" aria-label="Search everything" />
        <div class="gsearch-drop" id="gsearch-drop" hidden></div>
      </div>
    </div>
    </div>
    <main class="wrap" id="view" aria-live="polite"></main>
    <div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="/static/qrcode.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
